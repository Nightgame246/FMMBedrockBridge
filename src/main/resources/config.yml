# FMMBedrockBridge — EM↔Bedrock UX-Bridge
#
# Requires:
#   - FreeMinecraftModels 2.6.0+ with sendCustomModelsToBedrockClients: true
#     (FMM handles mob/static rendering natively for Bedrock)
#   - ResourcePackManager 2.0.2+ (Java→Bedrock pack + EM UI item conversion)
#   - PacketEvents (packet manipulation)
#   - Floodgate (Bedrock player detection)
#
# This plugin only adds the EM UX layer that MagmaGuy doesn't provide natively:
#   - Phase 7.1a/c: Combat-triggered styled BossBar (replaces EM's "Evoker | 2")

# Master switch
enabled: true

# Debug mode — logs verbose diagnostic info (BossBar UUID claims, combat state).
# See /fmmbridge debug for live state.
debug: false

# Distance in blocks within which Bedrock players are added as viewers of the BossBar
# controllers. Same range FMM uses for its own model visibility.
entity-view-distance: 50

# Phase 7.1a — BossBar replacement for EliteMobs bosses
phase71a:
  # When true, suppress EliteMobs' own BossBar packets to Bedrock players (Bedrock sees
  # only our replacement BossBar with the styled name). Set to false to see both bars
  # side-by-side as a diagnostic.
  suppress-em-bossbar: true

  # How the bridge recognises its OWN BossBar packets, so it suppresses EliteMobs' bar
  # instead of its own.
  #
  #   true  (default) — read the bar's wire UUID directly off the Bukkit BossBar via
  #                     reflection. Deterministic, and the only reliable option since
  #                     EliteMobs 10.8.0 pools and re-titles up to four bars per player.
  #   false           — use the old heuristic ("the first title-matching bar is ours").
  #
  # Only set this to false if Bedrock players see NO boss bar at all after a server or
  # Paper update: that is what a mis-resolved UUID looks like. The startup log says which
  # mode is active.
  resolve-own-bossbar-uuid: true

# Phase 7.1b (HP-Overlay über Mobs, nur Bedrock) wurde am 01.10.2026 AUSGEBAUT:
# EliteMobs' eigene Overhead-HP-Anzeige (MobCombatSettings.yml: displayVisualHealthBars +
# displayNumericHealth) erreicht Bedrock inzwischen — im A/B-Test stand sonst alles doppelt.
# Ein alter Eintrag "phase71b:" in dieser Datei wird ignoriert.

# Phase 7.1c — Combat-triggered visuals (HP/Bar/BossBar)
phase71c:
  # When true, BossBar appears only during combat (EnterCombat → ExitCombat).
  # When false, BossBar is always-visible (Phase 7.1a behavior).
  combat-enabled: true
  # EliteMobs sometimes does not fire a second EnterCombat event after combat paused.
  # When true, EliteMobDamagedByPlayerEvent also refreshes Bedrock combat UI. This is
  # the same event EliteMobs uses for Java's HP/name displays.
  damage-refresh-enabled: true
  # When false, the BossBar stays visible until the display timeout even if EM fires ExitCombat,
  # matching Java's "lingers after last hit" feel more closely.
  hide-on-exit-event: false
  # 0 = use EliteMobs' MobCombatSettings.yml combatDisplayTimeoutSeconds (default 30s).
  # Set a positive tick value to override only the Bedrock BossBar timeout.
  damage-timeout-ticks: 0

# Phase 7.1d — nur EIN Name über modellierten Bossen auf Bedrock
#
# FMM zeichnet sein eigenes Namensschild über dem Modell, auch für Bedrock. Bedrock zeigt
# zusätzlich den Custom-Namen des Mobs darunter — bei EliteMobs-Bossen den allgemeinen aus dem
# Mob-Typ (z. B. "Evoker"). Die Bridge blendet diesen Mob-Namen nur für Bedrock aus, sobald das
# Modell einen echten Namen hat ("Default Name" = unbenannt, zählt nicht). Java sieht nichts davon.
#
# Nur auf false setzen, falls FMM sein Namensschild für Bedrock einmal nicht mehr zeigt.
# Ausbauen: siehe Klassenkommentar von BedrockNameFix.
phase71d:
  bedrock-name-fix: true

# Phase 7.3 / 7.3b — Bedrock menu dialog-reroute
phase73:
  # Reroute the Bedrock /em status menu to EliteMobs' native MC dialog so Geyser
  # renders it as a native Bedrock form (sub-pages cascade natively). Requires
  # MC >= 1.21.6. Java players are unaffected. Use the top-level `debug: true`
  # to log the title of every inventory a Bedrock player opens.
  bedrock-dialog-reroute: true
  # Reroute Bedrock EliteMobs NPC quest menus (single quest + multi-quest list) to
  # EM's native quest dialog. Same requirements/behaviour as above; toggle separately.
  bedrock-quest-reroute: true
  # Phase 7.3c: EliteMobs' class menu (/em class, the Classes button, class trainer NPCs)
  # as its dialog instead of the chest — every page and every button. Only where Bedrock is
  # the ONLY reason for the chest: players who picked chest menus in EliteMobs, and servers
  # set to chests only, keep them. Read on every render, no restart needed.
  bedrock-class-reroute: true

# Phase 7.4 — Bedrock-Eingabe für EliteMobs' Advanced Combat System
#
# EliteMobs 10.9.0 bindet seine drei Fähigkeits-Slots an einen F-Chord
# (F,F / F+LMB / F+RMB). F ist der Offhand-Tausch — den gibt es auf Bedrock nicht,
# weder auf Controller noch auf Touch. Bedrock-Spieler können damit KEINE aktive
# Fähigkeit auslösen. Details: docs/upstream-bugs/em-advanced-combat-bedrock-input-lockout.md
#
# Diese Phase übersetzt das auf Schleichen — als GEHALTENEN Modifikator, nicht als
# Zeitfenster. Solange geschlichen wird, ist die Steuerung scharf:
#   Linksklick              -> Signature (beliebig oft)
#   Rechtsklick             -> Utility   (beliebig oft)
#   Loslassen + neu ducken  -> Mobility
#   Loslassen               -> Steuerung aus
#
# Frühere Fassungen hatten hier ein Zeitfenster nach EliteMobs' Vorbild. Das passt zu einem
# Tastendruck, nicht zu einem Zustand: im Spieltest am 11.09. lief es beim Zielen ab, und nach
# der ersten Fähigkeit war es verbraucht, obwohl der Spieler noch geduckt war.
#
# Java-Spieler sind nicht betroffen und behalten EMs Originalsteuerung.
phase74:
  # Gesamtschalter. Die Phase registriert sich beim Start, sobald EliteMobs' Klassen
  # vorhanden sind. Ob die Schleich-Steuerung dann tatsächlich etwas auslöst, entscheidet
  # EliteMobs zur Laufzeit: Sie bleibt stumm, solange EM selbst nicht handeln würde —
  # Advanced Combat System aus, keine Klasse gewählt, oder außerhalb von Dungeon/Match.
  bedrock-abilities: true


  # Wenn true, ist die Steuerung nur im Kampf bzw. in Dungeons scharf. Auf false
  # gesetzt löst auch normales Schleichen beim Bauen Fähigkeiten aus — nicht empfohlen.
  require-combat: true

  # Schleichen + Hotbar-Taste löst die Fähigkeit aus, mit EliteMobs' eigenen Zahlen:
  # 1/7 Mobility, 2/8 Signature, 3/9 Utility (4-6 bleiben normaler Item-Wechsel).
  #
  # Nötig seit dem Spieltest am 27.09.2026: Rechtsklick in die Luft schickt mit leerer Hand
  # gar kein Paket, Utility ging nur mit einem Block im Fadenkreuz. Ein Slot-Wechsel kommt
  # von jedem Gerät an.
  #
  # Auf false setzen, wenn Konsolenspieler stören: dort blättert LB/RB Slot für Slot, und
  # wer dabei schleicht, löst jede Fähigkeit aus, an der er vorbeikommt.
  hotbar-keys: true

  # Zusätzliche Rückmeldung in der Actionbar: welche Fähigkeit ausgelöst hat, bzw. warum
  # EliteMobs sie abgelehnt hat. Dazu beim Ducken die Belegung, z. B.
  # "[1/2×Ducken] Dash  [2/Links] Wirbel  [3/Rechts] Schild" — das Gegenstück zu der Zeile,
  # die EliteMobs Java-Spielern nach F zeigt.
  #
  # Standardmäßig AN seit 16.09.2026. Vorher stand hier false, weil die Meldung direkt an
  # den Client ging und dort von EliteMobs' Klassen-HUD binnen ein, zwei Ticks überschrieben
  # wurde — EM hält seit 10.9.0 die Actionbar dauerhaft belegt und rendert bei jeder
  # HP-Änderung neu. Die Rückmeldung läuft jetzt über EMs eigenen ActionBarCompositor
  # (Quelle ABILITY_INPUT, Priorität 310 gegen 100 des HUD), deshalb verdrängen sich
  # die beiden nicht mehr.
  feedback: true

# Phase 7.6 — EliteMobs-Menü-Hintergründe auf Bedrock
#
# EliteMobs zeichnet seine Menü-Hintergründe über Schrift-Zeichen im Kistentitel. Bedrock zeigt
# diese Zeichen als Kästchen. Die Bridge ersetzt sie für Bedrock durch unsichtbare
# Erkennungszeichen; das Pack "FMMBridge-EliteMobsMenus" im Geyser-packs-Ordner blendet daraufhin
# den Hintergrund ein. Java ist nie betroffen.
#
# REIHENFOLGE: erst das Pack auf den Proxy, dann diesen Schalter an. Ohne Pack zeigt Bedrock die
# Erkennungszeichen als Symbole.
phase76:
  bedrock-menu-backgrounds: true
  # Graue Slot-Kästchen in solchen Menüs ausblenden, wie Java es durch das Bild tut. Items und
  # Auswahl bleiben sichtbar. Auf false, falls ein Menü ohne Kästchen schwer bedienbar ist.
  hide-slot-backgrounds: true
