# FMMBedrockBridge — EM↔Bedrock UX-Bridge
#
# Requires:
#   - FreeMinecraftModels 2.6.0+ with sendCustomModelsToBedrockClients: true
#     (FMM handles mob/static rendering natively for Bedrock)
#   - ResourcePackManager 2.0.2+ (Java→Bedrock pack + EM UI item conversion)
#   - PacketEvents (packet manipulation)
#   - Floodgate (Bedrock player detection)
#
# This plugin only adds the EM UX layer that MagmaGuy doesn't provide natively:
#   - Phase 7.1a/c: Combat-triggered styled BossBar (replaces EM's "Evoker | 2")
#   - Phase 7.1b/c: Combat-triggered nametag overlay (HP / HP-Bar; FMM renders name)

# Master switch
enabled: true

# Debug mode — logs verbose diagnostic info (BossBar UUID claims, Nametag updates).
# See /fmmbridge debug for live state.
debug: false

# Distance in blocks within which Bedrock players are added as viewers of BossBar/Nametag
# controllers. Same range FMM uses for its own model visibility.
entity-view-distance: 50

# Phase 7.1a — BossBar replacement for EliteMobs bosses
phase71a:
  # When true, suppress EliteMobs' own BossBar packets to Bedrock players (Bedrock sees
  # only our replacement BossBar with the styled name). Set to false to see both bars
  # side-by-side as a diagnostic.
  suppress-em-bossbar: true

  # How the bridge recognises its OWN BossBar packets, so it suppresses EliteMobs' bar
  # instead of its own.
  #
  #   true  (default) — read the bar's wire UUID directly off the Bukkit BossBar via
  #                     reflection. Deterministic, and the only reliable option since
  #                     EliteMobs 10.8.0 pools and re-titles up to four bars per player.
  #   false           — use the old heuristic ("the first title-matching bar is ours").
  #
  # Only set this to false if Bedrock players see NO boss bar at all after a server or
  # Paper update: that is what a mis-resolved UUID looks like. The startup log says which
  # mode is active.
  resolve-own-bossbar-uuid: true

# Phase 7.1b — combat HP overlay (number + bar) above bridged mobs, Bedrock-only.
phase71b:
  # EliteMobs renders an equivalent display itself since 9.6.0 — see
  # plugins/EliteMobs/MobCombatSettings.yml: displayVisualHealthBars + displayNumericHealth.
  # Set to false to drop our overlay. Use this to test whether EM's own display reaches
  # Bedrock clients: if it does, this scope is redundant and can be removed; if it does not,
  # keep ours and turn EM's off instead so nothing is shown twice.
  #
  # Does NOT affect the BossBar — EliteMobs still has no Bedrock path for that.
  nametag-enabled: true

# Phase 7.1c — Combat-triggered visuals (HP/Bar/BossBar)
phase71c:
  # When true, BossBar appears only during combat (EnterCombat → ExitCombat). Nametag
  # overlay shows HP / Health-Bar during combat; FMM renders the mob name natively.
  # When false, BossBar is always-visible (Phase 7.1a behavior).
  combat-enabled: true
  # EliteMobs sometimes does not fire a second EnterCombat event after combat paused.
  # When true, EliteMobDamagedByPlayerEvent also refreshes Bedrock combat UI. This is
  # the same event EliteMobs uses for Java's HP/name displays.
  damage-refresh-enabled: true
  # When false, HP/Bar stays visible until the display timeout even if EM fires ExitCombat,
  # matching Java's "lingers after last hit" feel more closely.
  hide-on-exit-event: false
  # 0 = use EliteMobs' MobCombatSettings.yml combatDisplayTimeoutSeconds (default 30s).
  # Set a positive tick value to override only the Bedrock overlay timeout.
  damage-timeout-ticks: 0

# Phase 7.3 / 7.3b — Bedrock menu dialog-reroute
phase73:
  # Reroute the Bedrock /em status menu to EliteMobs' native MC dialog so Geyser
  # renders it as a native Bedrock form (sub-pages cascade natively). Requires
  # MC >= 1.21.6. Java players are unaffected. Use the top-level `debug: true`
  # to log the title of every inventory a Bedrock player opens.
  bedrock-dialog-reroute: true
  # Reroute Bedrock EliteMobs NPC quest menus (single quest + multi-quest list) to
  # EM's native quest dialog. Same requirements/behaviour as above; toggle separately.
  bedrock-quest-reroute: true
